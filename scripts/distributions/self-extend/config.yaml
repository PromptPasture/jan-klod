# jan-klod — self-extend distribution: `coding`, plus a shell so the agent can compile.
#
# Export OPENAI_API_KEY before starting.
#
# Does not widen the sandbox. Commands may write only under the workspace (`writable: ["."]`). The host grants
# `/dev/null` and a `TMPDIR` inside the workspace to every command, so a `cargo build` needs no extra grant.
#
# Dependencies are vendored: `cargo vendor` into the workspace, and builds run `--offline`. The network stays denied,
# because a build that can reach the network could exfiltrate. Measured: 47 crates, 34 MB for a guest workspace.
#
# Verified offline end to end: with a cold `CARGO_HOME` and vendored sources, a wasm guest builds under the jail.

extensions:
  provider:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6

  interceptor:
    intent-router:
      enabled: true
    task-router:
      enabled: true
    context:
      enabled: true
    system:
      enabled: true
    tool-selector:
      enabled: true
    permission:
      enabled: true
    # Content policy: looks at what the text says. `permission` above asks whether an action may happen.
    # Keys and the full rule reference: pkgs/host/config/docs/configuration.md#guardrails.
    guardrails:
      enabled: true
      # `shell` is enabled here, so `deny-tool-arguments` has something to refuse. These shapes are never a build step.
      # The sandbox is the security boundary; these rules make refusals visible in the transcript.
      deny-tool-arguments:
        - pattern: "rm +-[a-zA-Z]*r[a-zA-Z]* +/"
          tool: shell
          reason: "a recursive delete rooted at a filesystem root"
        - pattern: "curl[^|]*\\|[^|]*sh"
          tool: shell
          reason: "piping a download into a shell — the network is denied, so this cannot work, and asking is the interesting part"
      redact:
        - pattern: "sk-[A-Za-z0-9]{16,}"
          with: "[redacted api key]"
          reason: "an API key of the shape this distribution's own provider uses"
        - pattern: "gh[pousr]_[A-Za-z0-9]{36}"
          with: "[redacted github token]"
          reason: "a GitHub token, and this distribution ships git tooling"

  registry:
    skills:
      enabled: true

  tool:
    fs:
      enabled: true
    edit:
      enabled: true
    find:
      enabled: true
    git:
      enabled: true
    # The one tool `coding` withholds. Confined by `execution.sandbox` below and gated by `interceptor.permission`.
    shell:
      enabled: true

storage:
  path: ./jan-klod.db

registry:
  # No keys are trusted, so registry installs refuse every name.
  trusted-keys: []
  # Lets the agent install a component it just compiled, by path. Needs `allow-unsigned` and the component's `sha256`;
  # self-authored is not a trust exemption. The component still needs a manifest declaring its imports.
  install-tool: true

# Commands are on here, and confined. Read docs/concepts/security-model.md's "Command effects" row before changing this block.
execution:
  enabled: true
  # A cold `cargo build` outruns the 30s default and reads like a hang.
  timeout-secs: 600
  output-cap: 262144
  sandbox:
    mode: os
    writable: ["."]
    network: false
    # Confined or not at all: on a platform with no sandbox backend, nothing runs.
    require: true
