# jan-klod — coding distribution.
#
# Commands are off until enabled. When enabled, they are confined.
#
# Export OPENAI_API_KEY before starting.

extensions:
  provider:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6

  interceptor:
    intent-router:
      enabled: true
    task-router:
      enabled: true
    context:
      enabled: true
    system:
      enabled: true
    tool-selector:
      enabled: true
    permission:
      enabled: true
    # Content policy: looks at what the text says. `permission` above asks whether an action may happen.
    # Keys and the full rule reference: pkgs/host/config/docs/configuration.md#guardrails.
    guardrails:
      enabled: true
      # Redaction only. No `deny-tool-arguments` rule: nothing here reaches a target to refuse (no shell; `git` is
      # read-only and refuses commit, push, checkout and reset itself). A rule with no reachable target would be a
      # demonstration. Add one when commands are turned on; the root config.yaml shows how.
      #
      # Both rules match shapes that cannot be anything else. They reach the transcript when the agent reads a file
      # containing the key, so redacting at the boundary keeps a credential from outliving the turn that saw it.
      redact:
        - pattern: "sk-[A-Za-z0-9]{16,}"
          with: "[redacted api key]"
          reason: "an API key of the shape this distribution's own provider uses"
        - pattern: "gh[pousr]_[A-Za-z0-9]{36}"
          with: "[redacted github token]"
          reason: "a GitHub token, and this distribution ships git tooling"

  registry:
    skills:
      enabled: true

  tool:
    fs:
      enabled: true
    edit:
      enabled: true
    find:
      enabled: true
    git:
      enabled: true

storage:
  path: ./jan-klod.db

registry:
  trusted-keys: []

# Commands are denied. Enabling them is deliberate: read docs/concepts/security-model.md's "Command effects" row first.
execution:
  enabled: false
  sandbox:
    mode: os
    writable: ["."]
    network: false
