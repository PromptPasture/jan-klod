# jan-klod — headless-chat distribution.
#
# Chat channel over Telegram (`jan-klod-gateway telegram`). No file tools, registries or execution.
#
# Export OPENAI_API_KEY before starting.

# Telegram sender ids become principals `telegram:<sender_id>`. The Bot API asserts the id; jan-klod does not
# authenticate it. Operators list permitted ids. Empty by default: every sender is refused before a session is created.
telegram:
  allowed-senders: []

extensions:
  provider:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6

  interceptor:
    intent-router:
      enabled: true
    task-router:
      enabled: true
    context:
      enabled: true
    system:
      enabled: true
    tool-selector:
      enabled: true
    permission:
      enabled: true

storage:
  path: ./jan-klod.db

registry:
  trusted-keys: []

# Commands are off. Stated explicitly so the decision is visible. pkgs/host/host/tests/it/bundle_distributions.rs asserts this.
execution:
  enabled: false
