# jan-klod — minimal distribution.
#
# One provider and the interceptor set. No tools, registries or execution.
#
# Export OPENAI_API_KEY before starting.

extensions:
  provider:
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini

  interceptor:
    intent-router:
      enabled: true
    task-router:
      enabled: true
    context:
      enabled: true
    system:
      enabled: true
    tool-selector:
      enabled: true
    permission:
      enabled: true

storage:
  path: ./jan-klod.db

registry:
  trusted-keys: []

execution:
  enabled: false
