name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0
      - uses: taiki-e/install-action@v2
        with:
          tool: jaq@2.3.0

      - name: Install wkg (WIT package manager)
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch WIT spike deps
        run: make -C pkgs/extensions spike-deps

      - name: Build bundles (one per distribution)
        env:
          JK_VERSION: ${{ github.ref_name }}
        run: |
          make bundle DIST=coding
          make bundle DIST=headless-chat
          make bundle DIST=minimal
          make bundle DIST=self-extend

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Sign the components
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set — components will be published UNSIGNED and the index will say so (#93)"
            exit 0
          fi
          curl -sSLo /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 0600 /tmp/minisign.key
          for f in ext/*.wasm ext/*.manifest.toml; do
            printf '\n' | minisign -S -H -s /tmp/minisign.key -m "$f" -t "jan-klod $GITHUB_REF_NAME"
          done
          shred -u /tmp/minisign.key
          ls -1 ext/*.minisig

      - name: Generate the registry index
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          make registry-index \
            REGISTRY_INDEX="$PWD/dist/index.json" \
            REGISTRY_URL="https://promptpasture.github.io/jan-klod/ext"
          cat dist/index.json

      - name: Upload the registry artifact
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: |
            dist/index.json
            ext/*.wasm
            ext/*.manifest.toml
            ext/*.minisig
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install minisign
        id: minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set — this release will be UNSIGNED (#93)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sSLo /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/minisign.tar.gz -C /tmp
          install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sign the release archives
        if: steps.minisign.outputs.available == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 0600 /tmp/minisign.key
          for f in dist/*.tar.gz dist/SHA256SUMS.txt; do
            printf '\n' | minisign -S -H -s /tmp/minisign.key -m "$f" -t "jan-klod $GITHUB_REF_NAME"
          done
          shred -u /tmp/minisign.key
          ls -1 dist/*.minisig

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            NOTES=$(git log --oneline "${PREV}..HEAD" | head -30)
          else
            NOTES=$(git log --oneline -30)
          fi
          printf '%s\n' "$NOTES" > /tmp/release_notes.txt
          echo "notes_file=/tmp/release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.minisign.outputs.available }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/SHA256SUMS.txt)
          for f in dist/*.minisig; do [ -e "$f" ] && assets+=("$f"); done
          flags=()
          if [ "$SIGNED" != "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "jan-klod $GITHUB_REF_NAME" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            "${flags[@]}" "${assets[@]}"

      - name: Download the registry artifact
        uses: actions/download-artifact@v4
        with:
          name: registry
          path: registry/

      - name: Build the landing page
        uses: actions/jekyll-build-pages@v1
        with:
          source: pages
          destination: _site

      - name: Assemble the registry into the site
        run: |
          cp registry/dist/index.json _site/index.json
          mkdir -p _site/ext
          cp registry/ext/*.wasm registry/ext/*.manifest.toml _site/ext/
          cp registry/ext/*.minisig _site/ext/ 2>/dev/null || true
          ls -l _site/ext | head

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
