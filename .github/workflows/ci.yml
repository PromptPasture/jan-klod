name: CI

# Enforces the gates the Makefiles define — lint, host tests, the Component-Model
# exit-gate harness, and the Phase 1 supply-chain gates. CI installs the tooling
# and then calls the same `make` targets a developer runs locally, so the gate is
# reproducible off the runner.

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR — cancel a superseded run rather than let it finish. No
# paths-ignore for docs: docs_match_config.rs's tests read README.md, docs/**
# and pages/index.md, so a doc-only push still has to run lint-test.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint + test (host workspace + web client)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2 for `make wit`'s version check, which compares `wit/`
      # against a baseline. The default depth-1 checkout has no parent commit
      # and no usable `origin/main`, so the check would report "no baseline"
      # on every run and the job would still be green — a check that never
      # runs, which is the thing it exists to prevent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # wasm32-wasip2 because this job stages the guests below, and without the
      # target `cargo build --target wasm32-wasip2` dies on the first dependency
      # (`can't find crate for core`) before any test runs. It was missing, so
      # every run of this job failed at that step from the moment it was added.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      # `make test` also runs the Go supervisor's `go vet` + `go test`.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      # `make test` runs the suite under cargo-nextest — one process per test,
      # and a filter matching nothing exits non-zero instead of reporting green.
      # Prebuilt binary, as with the supply-chain plugins below: `cargo install`
      # from source would rebuild it on every run.
      #
      # Pinned, like every other tool here: these Makefiles parse nextest's
      # output, so a CLI change lands on us the way cargo-deny's did. Keep in
      # step with CARGO_NEXTEST_VERSION in the root Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # `make -C src/extensions all` generates each guest's capability manifest
      # by reading the component's own imports out of `wasm-tools component wit`,
      # so staging the guests now needs this. Pinned like everything else here:
      # these Makefiles parse its output. Keep in step with WASM_TOOLS_VERSION in
      # the root Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0

      # Two things resolve wit/spike/deps (wasi:cli & co) through bindgen!: the
      # spike_gate example, which `make clippy` compiles by passing the `examples`
      # feature it is gated behind, and the `it` test binary's polyglot module,
      # which `make test` builds. Those deps are gitignored and fetched on demand
      # from the committed wit/wkg.lock, so populate them first — the same `wkg
      # wit fetch` a developer runs locally. Making the examples opt-in did not
      # take this off the test path; the polyglot module was always on it.
      #
      # Prebuilt binary (pinned to the version that produced wit/wkg.lock) — instant,
      # unlike `cargo install wkg`, which recompiles from source every run. wkg ships
      # pure binaries (no archive), hence extension-matching + rename + chmod.
      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C src/extensions spike-deps

      # Validate the WIT contracts, and warn if an edit to them did not bump the
      # package version. No job ran `make wit` before this: `make test` and
      # `make gate` reach `wit/` only through the guests that bind it, so a
      # malformed contract or an unbumped version was caught by neither. Runs
      # before the guests are staged, since they are built against these files.
      - run: make wit

      # Stage the guests before testing. Without this the integration tests do not
      # fail — they *skip*, because an absent component is a legitimate state for a
      # developer who has not run `make ext` yet. That made this job's roughly
      # thirty component tests no-ops while it reported success, the same way the
      # pre-commit hook did until it was fixed. The `gate` job below was unaffected:
      # it stages guests first.
      - name: Stage guest components
        run: make -C src/extensions all

      # #79 gated the host's integration suite (host/tests/it/) behind the
      # `integration` cargo feature, so plain `make test` now builds and runs unit
      # tests only — host workspace + guest native tests + the Go supervisor, no
      # wasmtime link, no ~200M `it-*` binary. Deliberately not passing the feature
      # here: before #79 this step already built and ran the full integration suite
      # unconditionally, duplicating the `harness` job's `make gate` below — #64 kept
      # that duplication because two independent runners cost nothing extra in wall
      # clock. The feature gate changes that trade: carrying the suite here again
      # would now cost a real extra wasmtime link and ~160 extra tests on every push,
      # for signal that two identical ubuntu-latest runners on the same commit add
      # little over one. So `harness` remains the sole job that exercises the full
      # suite — its `make gate` has its own zero-test guard, so a broken
      # `--features` flag fails loudly rather than this job silently covering for
      # it. `make clippy` below still type-checks tests/it (see src/core/Makefile),
      # so a compile error there still fails this job even though nothing here
      # links or runs it.
      #
      # …and make a skip a failure, so this can never hollow out silently again.
      - run: make test
        env:
          JK_REQUIRE_GUESTS: "1"

      # The browser client's suite (#127). It ran nowhere until this step: the
      # tests existed and passed, but no Makefile target and no workflow named
      # them, so every frame kind, the `ask` roundtrip and cancel were unguarded
      # — which is why host/tests/it/web_client.rs does not lean on them.
      #
      # Here rather than in a job of its own: `make test-web` is one command
      # that needs Node and nothing else, and a separate job would pay another
      # checkout and another runner for it — the same trade #120 made for the
      # npm supply-chain leg. Here rather than in the `supply-chain` job for the
      # plainer reason that this is a test, not a supply-chain gate.
      #
      # node-version pinned, and pinned to the same string the `supply-chain`
      # job uses; keep the two in step. Quoted, because an unquoted 22.23.2
      # would be fine but an unquoted 22.10 parses as a float and silently
      # selects 22.1.
      #
      # `cache: npm` here and deliberately not in the `supply-chain` job: that
      # job's leg resolves without installing and leaves 8 KB behind, which is
      # why its comment says to add a cache the day a step installs. The drift
      # check below is that day — it runs `npm ci`, which fetches esbuild's
      # platform binary on every run.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Web client tests (src/web)
        run: make test-web

      # The committed `src/web/dist/` is still what `src/web/src/` builds
      # (#127). #119 box 1 committed the bundle on the argument that this
      # repository's other generated artifacts — protocol.schema.json,
      # ext/*.manifest.toml, wit/wkg.lock — each carry a drift check; dist/ was
      # the first one without. `serve.rs` embeds it with include_str!, so
      # without this an edit to src/web/src/*.ts that is never rebuilt makes the
      # core serve a stale client with the whole of CI green.
      #
      # Rebuilds in a temp tree and diffs, so the step cannot "fix" the drift by
      # leaving a rebuilt dist/ in the runner's checkout. The script says why it
      # uses `npm ci` rather than `npm install`.
      - name: Web dist drift (src/web/dist is what src builds)
        run: make web-dist-drift

      # The registry index is a function of the staged components and nothing
      # else (#137). Named here rather than folded into another target for the
      # reason #130 recorded: a gate `ci.yml` does not call by name does not
      # run, and looks exactly like a gate that passes.
      #
      # In this job because the guests are already staged above — the check
      # needs `ext/*.manifest.toml`, and `JK_REQUIRE_GUESTS` inside the target
      # makes an unstaged `ext/` a failure rather than a skip. It also probes
      # itself, so a generator that is not in fact deterministic is refused
      # rather than waved through.
      - name: Registry index determinism (#137)
        run: make registry-index-drift

      - run: make clippy

  harness:
    name: Component harness (exit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # Cache only the heavy host workspace (wasmtime); the guests are ~35-dep
      # crates that build in seconds, so they are not worth enumerating here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      # `make gate` runs under cargo-nextest; see the lint-test job for why, and
      # for why the version is pinned.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # `make gate` builds the guests, which now also generates their manifests
      # from the components' real imports. See the lint-test job above.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0

      # `make gate` builds the `it` test binary, and its polyglot module resolves
      # wit/spike through bindgen!, so this job needs wit/spike/deps too. It died
      # on "failed to resolve directory while parsing WIT for path .../wit/spike"
      # before running a single test: gating the examples behind a feature fixed
      # the example this job used to build, but the test binary binds the same
      # world. Same pinned install as the lint-test job above.
      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C src/extensions spike-deps

      # Exit gate: builds every guest to wasm32-wasip2, then runs the full offline
      # integration surface across all v1 guarantees — the thin loop with provider
      # fallback, durable state + REST, UI + Telegram roundtrips, streaming/cancel/
      # steering, the file-workspace substrate, and the tool fleet.
      #
      # `make harness` used to run first. It names nine test targets, every one a
      # file in src/core/host/tests/ that this job's `cargo test --workspace`
      # already runs — so it was a second build and run of nine wasmtime-linked
      # binaries, and it ran *without* JK_REQUIRE_GUESTS, meaning its own tests
      # could skip and still report success. `gate` stages the guests itself
      # (`gate: extensions`) and sets the flag, so dropping it loses nothing.
      - run: make gate

  gui:
    name: GUI shell (src/gui)
    runs-on: ubuntu-latest
    # A job of its own, unlike `test-web`, and the reason is the tree rather
    # than a preference: `src/gui` is a separate cargo workspace with 256
    # packages the host workspace does not have (#141). Folding it into
    # `lint-test` would put that build and a distinct `rust-cache` workspace key
    # on the job every other check waits for; here it runs in parallel on a
    # runner that bills at 1x.
    #
    # Nothing else in CI covers it: `make gate` and `make clippy` are the host
    # workspace, and `src/gui` is not a member. Without this job the shell would
    # compile nowhere and its tests would run nowhere, which is the #130 failure
    # — a check that does not run looks exactly like one that passes. The
    # supply-chain job *does* cover it already, because the root `lockfile`,
    # `deny` and `audit` targets name all three workspaces.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/gui

      # The build-time half of what #141 measured. `xvfb` is the other half:
      # a webview needs a display server, and without one `make test-gui` skips
      # itself — which is exactly the silent no-op JK_REQUIRE_GUI exists to
      # forbid, so the display has to be real before that flag means anything.
      - name: Install the webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Format
        run: make -C src/gui fmt

      - name: Lint
        run: make clippy-gui

      # `JK_REQUIRE_GUI=1` turns "no display, skipping" into a failure. Paired
      # with `xvfb-run` rather than set on its own: the flag asserts that a skip
      # here would be a lie, and xvfb is what makes that true.
      - name: Test (unit + webview smoke, under xvfb)
        env:
          JK_REQUIRE_GUI: "1"
        run: xvfb-run -a make test-gui

  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `make lockfile` (root Makefile) — every committed Cargo.lock must already
      # be current, --locked, or the audited/denied tree below is not the tree
      # that builds. This used to be a loop inlined here and, separately, in
      # `.github/hooks/pre-push` — the same commands typed twice, free to drift.
      # Both now call the one target (#72).
      #
      # Three workspaces since #142: the host, the guests, and `src/gui`. The
      # last is not built by any other job in this file, so this is the only
      # place its lock and its licences are checked — and it is the tree that
      # `deny.toml`'s eleven named entries exist for (#141).
      - name: Verify lockfiles (--locked)
        run: make lockfile

      # Prebuilt binaries — far faster than `cargo install` from source.
      #
      # All three are pinned, and cargo-deny is why: 0.20 removed `--config` from
      # the `check` subcommand and made it global, so 0.19 and 0.20 need
      # different invocations. Unpinned, this resolved to `@latest` (0.20.2)
      # while local machines still had 0.19, and this job failed on main for days
      # with "unexpected argument '--config' found". cargo-audit and
      # cargo-cyclonedx had the identical exposure — `make audit` reads the
      # former's exit code and `make sbom` the latter's output file — so they no
      # longer float either. Keep in step with the CARGO_*_VERSION variables in
      # the root Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-cyclonedx@0.5.9

      - name: cargo-deny (license / advisory / source policy)
        run: make deny

      - name: cargo-audit (RUSTSEC)
        run: make audit

      # Go modules under src/extensions (currently only the Slice 1a canary):
      # verified module sums + govulncheck, readonly. cache-dependency-path globs
      # every go.sum; the Makefile target globs every go.mod — no path is pinned.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/extensions/*/go.sum

      - name: Go supply-chain (mod verify + govulncheck)
        run: make -C src/extensions go-supply-chain

      # The supervisor's own Go leg (#130). It was the last line of the root
      # `supply-chain` target, and this job calls the legs by name and never
      # calls `supply-chain` itself — so the vulnerability scan for the
      # repository's only production Go binary had never run on a runner, while
      # the step above scanned what this file's own comment calls "currently
      # only the Slice 1a canary". Nothing failed, because a gate that does not
      # run looks exactly like a gate that passes.
      #
      # A separate step rather than folded into the one above: they are
      # different modules with different makefiles, and naming it here is the
      # half that stops it going missing again.
      #
      # No cache key for it. `setup-go` above globs `src/extensions/*/go.sum`,
      # and src/supervisor has no go.sum at all — it is a dependency-free
      # binary, so `go mod verify` passes trivially and the work is
      # govulncheck's standard-library scan, which is where a Go toolchain CVE
      # would land.
      - name: Supervisor supply-chain (mod verify + govulncheck)
        run: make supervisor-supply-chain

      # The npm tree under src/web — the repository's third ecosystem, joining
      # this job rather than becoming an exception to it (#120).
      #
      # node-version is pinned for the reason the three cargo tools above are:
      # an unpinned version is what failed main for days. The asymmetry worth
      # knowing is that there is no `make setup` line to keep this in step with,
      # because npm ships inside Node rather than being a tool make can install
      # — the local leg uses whatever npm is on PATH. That is tolerable here and
      # would not have been for cargo-deny: `npm audit`'s verdict comes from the
      # registry's advisory database, so a client version difference changes the
      # CLI surface rather than which advisories are found.
      #
      # No `cache: npm`, deliberately, and this is measured rather than assumed:
      # `make web-supply-chain` resolves and audits without installing, so the
      # whole run leaves 8 KB across 3 files in the npm cache. Restoring and
      # saving that costs more than it saves. `setup-go` above caches because it
      # downloads modules for a real build; this leg downloads nothing. Add a
      # cache the day this step installs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      # Lockfile sync, then advisories. The sync half is load-bearing: `npm
      # audit` reads package-lock.json and is silent about a dependency that is
      # only in package.json, so audit alone would leave a newly added package
      # unscanned while reporting "found 0 vulnerabilities". The Makefile
      # comment carries the rest, including why --omit=dev must never be added.
      - name: Web supply-chain (npm lockfile sync + npm audit)
        run: make web-supply-chain

      # SBOM for the Rust workspace (CycloneDX JSON). cargo-cyclonedx installed
      # above via taiki-e/install-action alongside cargo-deny and cargo-audit.
      - name: Generate SBOM
        run: make sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
