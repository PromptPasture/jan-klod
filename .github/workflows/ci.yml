name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint + test (host workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0

      - uses: taiki-e/install-action@v2
        with:
          tool: jaq@2.3.0

      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C pkgs/extensions spike-deps

      - run: make wit

      - name: Stage guest components
        run: make -C pkgs/extensions all

      - name: Registry index (read by the capabilities test)
        run: make registry-index

      - run: make test
        env:
          JK_REQUIRE_GUESTS: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Markdown lint
        run: make lint-docs

      - name: Lint policy drift ([workspace.lints] in every workspace)
        run: make lints-drift

      - name: Registry index determinism (#137)
        run: make registry-index-drift

      - run: make clippy

      - run: make clippy-guests

      - run: make doc

  harness:
    name: Component harness (exit gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0

      - uses: taiki-e/install-action@v2
        with:
          tool: jaq@2.3.0

      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C pkgs/extensions spike-deps

      - name: Registry index (read by the capabilities test)
        run: make registry-index
      - run: make gate

  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify lockfiles (--locked)
        run: make lockfile

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-cyclonedx@0.5.9,jaq@2.3.0

      - name: cargo-deny (license / advisory / source policy)
        run: make deny

      - name: cargo-audit (RUSTSEC)
        run: make audit

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: pkgs/extensions/*/go.sum

      - name: Go supply-chain (mod verify + govulncheck)
        run: make -C pkgs/extensions go-supply-chain

      - name: Supervisor supply-chain (mod verify + govulncheck)
        run: make supervisor-supply-chain

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: npm supply-chain (npm lockfile sync + npm audit)
        run: make npm-supply-chain

      - name: Generate SBOM
        run: make sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
