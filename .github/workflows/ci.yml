name: CI

# Enforces the gates the Makefiles define — lint, host tests, the Component-Model
# exit-gate harness, and the Phase 1 supply-chain gates. CI installs the tooling
# and then calls the same `make` targets a developer runs locally, so the gate is
# reproducible off the runner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint + test (host workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `make test` also runs the Go supervisor's `go vet` + `go test`.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      # The spike_gate example's bindgen! resolves wit/spike/deps (wasi:cli & co),
      # which are gitignored and fetched on demand from the committed wit/wkg.lock.
      # `cargo test` and `clippy --all-targets` compile that example, so populate the
      # deps first — the same `wkg wit fetch` a developer runs locally.
      #
      # Prebuilt binary (pinned to the version that produced wit/wkg.lock) — instant,
      # unlike `cargo install wkg`, which recompiles from source every run. wkg ships
      # pure binaries (no archive), hence extension-matching + rename + chmod.
      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C src/extensions spike-deps

      - run: make test

      - run: make clippy

  harness:
    name: Component harness (exit gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # Cache only the heavy host workspace (wasmtime); the guests are ~35-dep
      # crates that build in seconds, so they are not worth enumerating here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      # Builds every guest to wasm32-wasip2, then verifies each guest's WIT
      # interface in isolation and runs the thin loop booted from config offline.
      - run: make harness

      # Exit gate: the full offline integration surface across all v1 guarantees —
      # the thin loop with provider fallback, durable state + REST, UI + Telegram
      # roundtrips, streaming/cancel/steering, the file-workspace substrate, and the
      # tool fleet. Reuses the guests staged by `make harness`.
      - run: make gate

  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Every committed Cargo.lock must already be current — a stale lock means the
      # audited/denied tree is not the tree that builds. The glob picks up the host
      # workspace plus every Rust guest (the Go spike has no Cargo.toml), so a new
      # guest is covered automatically.
      - name: Verify lockfiles (--locked)
        run: |
          for m in src/core/Cargo.toml src/extensions/*/Cargo.toml; do
            cargo metadata --locked --format-version 1 \
              --manifest-path "$m" >/dev/null
          done

      # Prebuilt binaries — far faster than `cargo install` from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo-deny (license / advisory / source policy)
        run: make deny

      - name: cargo-audit (RUSTSEC)
        run: make audit

      # Go modules under src/extensions (currently only the Slice 1a canary):
      # verified module sums + govulncheck, readonly. cache-dependency-path globs
      # every go.sum; the Makefile target globs every go.mod — no path is pinned.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: src/extensions/*/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go supply-chain (mod verify + govulncheck)
        run: make -C src/extensions go-supply-chain

      # SBOM for the whole deploy unit. download-syft puts the pinned binary on
      # PATH; `make sbom` is the same command a developer runs locally.
      - uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: make sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
