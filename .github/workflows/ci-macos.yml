name: CI (macOS sandbox)

# The Seatbelt backend is `#[cfg(target_os = "macos")]`, so every test that
# confines a command on macOS is invisible to `ci.yml` — all three of its jobs
# are `ubuntu-latest`, and a Seatbelt regression lands green (#95). This job is
# the other half of the matrix: Landlock is covered on every push by `ci.yml`'s
# harness job, Seatbelt is covered here.
#
# **A separate workflow rather than a fourth job in `ci.yml`, and that is forced
# rather than preferred.** `paths` is a trigger filter on the *workflow*
# (`on.<push|pull_request>.<paths>`); there is no per-job equivalent. Putting the
# filter in `ci.yml` would gate lint-test, harness and supply-chain behind it too,
# which is the opposite of what any of them need.
#
# **Why it is filtered at all: this repository is private, and GitHub bills macOS
# minutes at 10x Linux minutes against the private-repo allowance.** A full
# `make gate` on a cold macOS runner is roughly 15-25 wall minutes, so 150-250
# billed minutes per push — a free allowance gone in a handful of pushes. So this
# runs the platform-gated tests and the core unit suite, on the paths that can
# actually break them, plus on demand. Widening it to `make gate` or to every
# push is a cost decision, not a coverage tweak: re-decide it on #95 first.

on:
  push:
    branches: [main]
    paths:
      - 'src/core/core/src/sandbox*.rs'
      - 'src/core/host/tests/it/sandbox_*.rs'
      # The boot-path confinement pair lives here, not in a sandbox_* file
      # (#125). It is the only evidence that the runner
      # `Runtime::open_process_runner` actually builds is confined, and
      # security-model.md's command-effects row cites it as exactly that.
      - 'src/core/host/tests/it/execution_config.rs'
      - 'wit/host-process.wit'
      - '.github/workflows/ci-macos.yml'
  pull_request:
    paths:
      - 'src/core/core/src/sandbox*.rs'
      - 'src/core/host/tests/it/sandbox_*.rs'
      # The boot-path confinement pair lives here, not in a sandbox_* file
      # (#125). It is the only evidence that the runner
      # `Runtime::open_process_runner` actually builds is confined, and
      # security-model.md's command-effects row cites it as exactly that.
      - 'src/core/host/tests/it/execution_config.rs'
      - 'wit/host-process.wit'
      - '.github/workflows/ci-macos.yml'
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  seatbelt:
    name: Seatbelt sandbox (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # wasm32-wasip2 because the Seatbelt suite crosses the Component-Model
      # boundary — one of its tests drives a confined command through a guest —
      # so the guests have to be staged below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      # Pinned exactly as in ci.yml: these Makefiles parse nextest's output, and
      # the count guard below reads `nextest list`. Keep in step with
      # CARGO_NEXTEST_VERSION in the root Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # `make -C src/extensions all` generates each guest's manifest from the
      # component's real imports via `wasm-tools component wit`. Keep in step
      # with WASM_TOOLS_VERSION in the root Makefile.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.258.0

      # The `it` test binary's polyglot module resolves `wit/spike` through
      # `bindgen!` at compile time, so building *any* test in that binary needs
      # wit/spike/deps — including this job's, which runs only four of them.
      # Gitignored and fetched from the committed wit/wkg.lock, same pinned
      # install as ci.yml's two jobs.
      - name: Install wkg
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: bytecodealliance/wasm-pkg-tools
          tag: v0.15.1
          extension-matching: disable
          rename-to: wkg
          chmod: 0755
          cache: enable

      - name: Fetch spike WIT deps
        run: make -C src/extensions spike-deps

      - name: Stage guest components
        run: make -C src/extensions all

      # Assert the count, not the exit code — the same positive guard `make gate`
      # uses for the integration suite, and for the same reason. These tests are
      # `#[cfg(target_os = "macos")]`, so on any runner that is not macOS they
      # compile to nothing and a run over them is green having checked nothing.
      # nextest exits non-zero on a filter that matches nothing, but that catches
      # only a mistyped filter; this catches the whole module vanishing.
      #
      # **`list` runs on its own line, and its stderr is kept.** The first version
      # of this step was `n=$(cargo nextest list … 2>/dev/null | grep -c …)`, and
      # it could not report its own failure: under `bash -e` a `grep -c` finding
      # nothing exits 1 and kills the step before the echo, and `2>/dev/null`
      # threw away the compile error that would have said why. It failed with no
      # output but "exit code 1" — indistinguishable from the zero-test case it
      # exists to detect. So: let cargo fail loudly on its own exit code, then
      # count from a file, with `|| true` so "zero" reaches the `if` as a number
      # rather than as a dead shell.
      #
      # **`--color never` is load-bearing.** This workflow sets
      # `CARGO_TERM_COLOR: always`, which nextest honours even when stdout is a
      # file — and it colours the module and the test name as *separate* spans,
      # so `sandbox_seatbelt::` on the wire is
      # `…sandbox_seatbelt<ESC>[0m<ESC>[36m::…` and a literal grep for it matches
      # nothing. The first run failed exactly this way, reporting zero tests
      # while all four were listed. Locally the same command passes, because
      # nothing sets `CARGO_TERM_COLOR` there.
      - name: Guard — the Seatbelt tests must exist on this runner
        run: |
          cd src/core
          cargo nextest list -p jan-klod-host \
            --features jan-klod-host/integration --bins --tests \
            --color never > /tmp/nextest-list.txt
          # Both modules the run step below filters on (#125). Checking only
          # one would leave the other free to compile to zero tests and still
          # report green, which is the failure this guard exists to prevent.
          for module in sandbox_seatbelt:: execution_config::; do
            n=$(grep -c "$module" /tmp/nextest-list.txt || true)
            echo "ci-macos: $module resolves $n test(s)"
            if [ "$n" -eq 0 ]; then
              echo "ci-macos: zero tests compiled for $module — this job is checking nothing" >&2
              echo "--- what nextest listed ---" >&2
              head -40 /tmp/nextest-list.txt >&2
              exit 1
            fi
          done

      # JK_REQUIRE_GUESTS turns a silently-skipped test into a failure: an absent
      # component is a legitimate state locally, so without this the component
      # -boundary test would skip and the job would still report success.
      # `execution_config::` joins the filter rather than only the trigger
      # (#125), and the measurement is why: waking the job costs a whole run —
      # ~3.5 min, so ~35 billed minutes at 10× — while running these 17 tests
      # on top of the 4 Seatbelt ones adds 5.5 s, about one billed minute.
      # Adding the path without the filter would have paid ~97% of the cost to
      # wake a job that still would not run the tests the edit touched.
      #
      # These are the pair gated on `sandbox::host_backend()` rather than
      # `#[cfg]`, so here they exercise Seatbelt; on Linux the same assertions
      # run against Landlock on every push via ci.yml's `harness` job.
      - name: Seatbelt sandbox tests, and the boot path that resolves them
        run: |
          cd src/core && cargo nextest run -p jan-klod-host \
            --features jan-klod-host/integration sandbox_seatbelt:: execution_config::
        env:
          JK_REQUIRE_GUESTS: "1"

      # The core's own unit tests on macOS — cheap next to the above, and the
      # half of `sandbox.rs` that picks a backend is itself per-OS.
      - name: Core unit tests
        run: cd src/core && cargo test -p jan-klod-core
