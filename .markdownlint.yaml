# Reference: https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.yaml

default: true

# https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md013.md
MD013: false

# https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md024.md
MD024:
  siblings_only: true

# https://github.com/DavidAnson/markdownlint/blob/v0.41.0/doc/md025.md
MD025:
  front_matter_title: ""
  level: 1

# https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md040.md
MD040: false

# https://github.com/DavidAnson/markdownlint/blob/v0.40.0/doc/md060.md
# Off: the house table style pads cells but keeps the delimiter row tight, which no MD060 option accepts.
MD060: false
