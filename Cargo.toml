[workspace]
resolver = "2"
members = [
    "pkgs/host/agent",
    "pkgs/host/config",
    "pkgs/host/host",
    "pkgs/host/protocol",
    "pkgs/host/session",
    "pkgs/host/wasm",
    "pkgs/clients/tui",
]
exclude = ["pkgs/extensions"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "cache",
    "parallel-compilation",
    "wat",
    "backtrace",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
