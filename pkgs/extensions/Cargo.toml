[workspace]
resolver = "2"
members = [
    # Pure-Rust library, not a component; compiled into the guests below.
    "guest-fs",
    "provider-openai",
    "provider-anthropic",
    "registry-skills",
    "registry-mcp",
    "interceptor-intent-router",
    "interceptor-guardrails",
    "interceptor-permission",
    "interceptor-tool-selector",
    "interceptor-context",
    "interceptor-task-router",
    "interceptor-system",
    "interceptor-persona",
    "interceptor-principal-probe",
    "test-interceptor-persona",
    "tool-proc-probe",
    "tool-escape-probe",
    "tool-fs",
    "tool-shell",
    "tool-edit",
    "tool-find",
    "tool-git",
    "tool-fetch",
    "tool-web-search",
    "tool-ask-probe",
    "tool-hello",
    "tool-memory",
    "tool-plan",
    "tool-proc",
    "host-secrets-probe",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
guest-fs = { path = "guest-fs" }
wit-bindgen = "0.58"
serde_json = "1"
whatlang = "0.16"
regex = "1"
chrono = "0.4"

# Inherited by every guest via `lints.workspace = true`. Duplicates the root workspace's policy: cargo cannot inherit lints across workspaces.
[workspace.lints.rust]
unsafe_code = "deny"   # generated bindings opt back in locally
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"   # in-development; expect occasional #[allow]

# Same as the host workspace: line tables only, so backtraces still resolve to file:line.
[profile.dev]
debug = "line-tables-only"

# Dependencies drop their remaining line tables. Guests keep `line-tables-only`.
# Native test builds only; the wasm guests use `[profile.release]` below.
[profile.dev.package."*"]
debug = 0

# All guests are wasm32-wasip2 components and share one size/LTO profile. Cargo reads [profile.*] only from the workspace root.
[profile.release]
opt-level = "s"
strip = true
lto = true

# Thin LTO declined: guests ~12% larger and `make gate` ~13 s slower, for ~0.3 s saved per guest build. Do not re-propose without new numbers.
