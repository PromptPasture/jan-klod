[workspace]
resolver = "2"
members = [
    "guest-fs",
    "provider-openai",
    "provider-anthropic",
    "registry-skills",
    "registry-mcp",
    "interceptor-intent-router",
    "interceptor-guardrails",
    "interceptor-permission",
    "interceptor-tool-selector",
    "interceptor-context",
    "interceptor-task-router",
    "interceptor-system",
    "interceptor-persona",
    "interceptor-principal-probe",
    "test-interceptor-persona",
    "tool-proc-probe",
    "tool-escape-probe",
    "tool-fs",
    "tool-shell",
    "tool-edit",
    "tool-find",
    "tool-git",
    "tool-fetch",
    "tool-web-search",
    "tool-ask-probe",
    "tool-hello",
    "tool-memory",
    "tool-plan",
    "tool-proc",
    "host-secrets-probe",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
guest-fs = { path = "guest-fs" }
wit-bindgen = "0.58"
serde_json = "1"
whatlang = "0.16"
regex = "1"
chrono = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "s"
strip = true
lto = true

