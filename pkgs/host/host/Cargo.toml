[package]
name = "jk-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jan-klod-gateway"
path = "src/main.rs"

[dependencies]
jk-agent = { path = "../agent" }
jk-wasm = { path = "../wasm" }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2 = "0.10"
jk-protocol = { path = "../protocol" }
jk-config = { path = "../config" }
jk-session = { path = "../session" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "ansi"] }

[dev-dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
jk-tui = { path = "../../clients/tui" }
blake2 = "0.10"
ring = "0.17.14"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.29", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[features]
examples = []
integration = []

[[example]]
name = "provider_probe"
required-features = ["examples"]

[[example]]
name = "spike_gate"
required-features = ["examples"]

[[test]]
name = "it"
required-features = ["integration"]

[lints]
workspace = true
