[package]
name = "jk-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The WASM boundary (#181): boot, the linker, extension loading, the guest
# capability hosts and the sandbox. Everything that names wasmtime lives here,
# so the agent loop above it compiles against a crate boundary rather than a
# module one. No session store and no loop: guest storage arrives as a factory.
[dependencies]
jk-config = { path = "../config" }
jk-protocol = { path = "../protocol" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
toml = "0.9"
thiserror.workspace = true
ureq = "3"
# SHA-256 for `ext install --sha256` (Slice 16c-1). **Zero new packages**:
# `sha2` 0.10 is already in Cargo.lock, pulled in by wasmtime-wasi via wiggle,
# so this only makes a transitive crate a direct one. Measured before adding,
# the way `schemars` was measured and rejected at 7.
sha2 = "0.10"
# Nothing here calls `digest`; it is named only to switch on `mac` (#308).
# `jk-host`'s dev-only `blake2` enables `digest/mac`, and dev-dependency features
# reach test builds only, so without this line `cargo build` and `cargo test`
# resolve `digest` differently. That gives `sha2` a second hash, and through it
# `cranelift-codegen`, `wasmtime-environ`, `wasmtime-internal-cache` and every
# crate above them: the whole Wasmtime stack compiled twice. **Zero new
# packages**: `digest` 0.10 is already in the tree under `sha2`, and the `subtle`
# that `mac` adds is already a normal dependency via `rustls`.
digest = { version = "0.10", features = ["mac"] }
# Signature verification for `ext install` (Slice 16c-1). **One package, no
# transitive dependencies** — measured before adding. Verify-only on purpose:
# the host never signs anything, so a signing crate would be capability this
# binary has no use for. `minisign` (which signs) costs 10 packages and drags
# `rpassword` and `scrypt` in for interactive password prompts; the tests build
# their fixtures from `ring` + `blake2` instead (dev-only, in `jk-host`),
# at one more package.
minisign-verify = "0.2.5"
url = "2"

# `derive` only, and only for the `registry_index` example, which writes the
# index as a struct in declaration order. No runtime code here derives any more:
# the frame shapes that did left with the surfaces (#179).
[dev-dependencies]
serde.workspace = true

# Landlock, for the Linux command sandbox (Slice 15c). Target-gated, so it never
# reaches a macOS or Windows build: 3 packages (landlock, enumflags2,
# enumflags2_derive), measured before adding. The crate is a safe wrapper over
# the syscalls, which is what lets this repository keep `unsafe_code = "deny"`
# while confining a command — see `sandbox_landlock` for the rest of that story.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

# Off by default so a plain `cargo test` does not build the example, the same
# block jk-config's Cargo.toml carries for `dump`. It matters more here: this
# crate links wasmtime, and `registry_index` is a build-time generator nothing
# at runtime calls.
[features]
examples = []

[[example]]
name = "registry_index"
required-features = ["examples"]

[lints]
workspace = true
