[package]
name = "jk-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that knows SQLite. No wasmtime, so a transcript reader does not link a component runtime.
[dependencies]
# Turn vocabulary. Taken from here rather than from the loop's crate, which would be a dependency cycle.
jk-protocol = { path = "../protocol" }
serde_json.workspace = true
thiserror.workspace = true
# `bundled` compiles SQLite from source, so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[lints]
workspace = true
