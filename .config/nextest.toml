# cargo-nextest configuration for the host workspace. Deliberately near-empty:
# the runner is the point, not tuning it. Every test target runs under it.

[profile.default]
# Warn at 60s but never terminate: a kill would replace a slow test's own failure
# message with a bare timeout. Omitting `on-timeout` keeps termination off.
# 120s because lower thresholds print SLOW on healthy runs. `slow-timeout` must be
# explicit, since omitting it inherits nextest's terminating default. Real hangs are
# bounded by the CI job's timeout-minutes (.github/workflows/ci.yml).
slow-timeout = { period = "120s" }
