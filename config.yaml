# jan-klod configuration.
#
# Extensions are grouped by category (`provider`, `interceptor`, `tool`, ...).
# Each *named* entry under a category is one configured extension instance.
#
# The host reads only two keys from an entry:
#   enabled  — whether to load the instance (omit/false = skip).
#   type     — which wasm component implements it: ext/<category>-<type>.wasm.
#              Defaults to the entry name, so `provider.openai` implies
#              `type: openai` -> provider-openai.wasm. Point several instances at
#              the same `type` to reuse one wasm (several OpenAI-compatible
#              endpoints use provider-openai); give an instance its own `type`
#              when it needs different payloads/headers.
#
# Every other key in an entry is opaque to the core and served back to the
# extension instance through the host-config interface. ${VAR} references are
# expanded from the environment.

extensions:

  # ---- LLM providers: each entry is one configured endpoint ----
  # `type` selects the implementing wasm; reuse provider-openai for any
  # OpenAI-compatible endpoint, or set a dedicated type for a bespoke API.
  provider:
    openai:
      enabled: true
      type: openai  # default, shown for clarity
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic   # distinct wasm: different payload/headers
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6
    ollama:
      enabled: false
      type: ollama        # custom Ollama API -> provider-ollama.wasm
      base-url: http://localhost:11434/v1
      model: qwen2.5:7b
    lm-studio:
      enabled: false
      type: openai
      base-url: http://localhost:1234/v1
      model: qwen2.5:7b
    groq:
      enabled: false
      type: openai        # yet another OpenAI-compatible endpoint
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: llama-3.3-70b

  # ---- Interceptors: sandboxed decision hooks the core loop dispatches by phase.
  #      enabled/disabled ONLY — ordering is structural (phase order + load order),
  #      never configured here. See docs/concepts/configuration.md#interceptors.
  #
  #      `persist: true` on an instance lets its `host-storage` writes reach the
  #      session store instead of a private map that dies with the process. It is
  #      off by default and deliberately so: the permission gate keeps standing
  #      grants ("always allow fs:write") in host-storage, and a boundary should
  #      not become permanently open because of a click last week. Grant it to an
  #      interceptor that should remember across restarts, not to the one that
  #      decides what you are allowed to do. Each instance is namespaced to
  #      itself; it cannot read a peer's keys or a session transcript. ----
  interceptor:
    intent-router:
      enabled: true            # before-loop: simple vs agentic classification
    task-router:
      enabled: false           # select-model: applies the `routing:` table below.
                               # Off by default: it costs an extra model call per
                               # turn to classify the task. The routing block does
                               # nothing until this is on.
    context:
      enabled: true            # select-context: trims the replayed conversation to
                               # the model's window, oldest non-system messages
                               # first. On by default because turns now carry the
                               # session's history — without it a long session
                               # grows until the provider rejects the request.
      # context-tokens: 8000   # budget; default suits a small local model
    system:
      enabled: true            # select-model: prepends the standing instructions
                               # the turn runs under. On by default — without it
                               # no system message reaches the model at all.
      # prompt: |              # replaces the built-in text; empty string = none
      #   You are a terse reviewer. Never write files.
    tool-selector:
      enabled: true            # select-tools: expose the active tool set (Slice 2d).
                               # On by default: without it the enabled tool.* below
                               # are never offered to the model.
    permission:
      enabled: true            # tool-call: confirm anything not known read-only.
                               # On by default: the file tools below can write, and
                               # a write must be confirmed before it happens.
                               # Answer `always`/`never` to decide for a whole kind
                               # of action (`fs:write`, `shell:cargo`) instead of
                               # one call. Those decisions last for the run only —
                               # a restart asks again — and never cover an argument
                               # pointing outside the workspace.
      # The gate is an ALLOWLIST: anything not named here is confirmed. It was a
      # denylist of high-risk verbs (`shell`, `write`, `exec`, …), which cannot
      # name the verbs nobody thought of — `tool-edit` ships the ops `replace`
      # and `insert`, neither of which is `write`, so the tool that modifies
      # files went through ungated from the day it was added. A list of what is
      # safe gates the unknown by construction; the cost is that a new tool
      # prompts until someone classifies it.
      #
      #   safe-calls            — `name` or `name:op` that run unasked. REPLACES
      #                           the default (does not extend it); `[]` confirms
      #                           everything.
      #   allow-absolute-paths  — when true, absolute-path args skip the scope gate
      #   allow-parent-traversal— when true, `..` traversal skips the scope gate
      # Defaults shown below; delete keys to accept them.
      # safe-calls: [find, fs:read, fs:grep, git, edit:view, proc-probe]
      # allow-absolute-paths: false
      # allow-parent-traversal: false

  # ---- Capability catalogues ----
  registry:
    skills:
      enabled: false
    mcp:
      enabled: false

  # ---- Discrete callable tools ----
  # File tools are jailed to the workspace (the `workspace:` key below, or $PWD
  # when it is absent) and their writes are gated by interceptor.permission.
  tool:
    fs:
      enabled: true            # read / write / grep a workspace file
    edit:
      enabled: true            # hash-anchored partial edits (view -> replace/insert)
    find:
      enabled: true            # glob the workspace tree (discovery for read/grep)
    git:
      enabled: false           # read-only repo inspection (status/diff/log/show/
                               # branch) through host-process. Needs `execution:`
                               # below; it cannot modify the repository, so it is
                               # safe to enable wherever execution is allowed.
    shell:
      enabled: false           # run ANY command through host-process. Needs
                               # `execution:` below. Off by default: unlike
                               # tool.git, the command comes from the model.
    fetch:
      enabled: false           # GET a public http(s) URL as text (docs, an error
                               # page). OFF by default on purpose: a fetch is a
                               # read, but the URL is also an exfiltration channel
                               # — path and query carry whatever the model puts
                               # there, so a prompt-injected turn can post your
                               # workspace out one request at a time. Private,
                               # loopback and link-local addresses are refused
                               # even when enabled; `allow-private: true` opts
                               # into your own intranet.
      network: true            # grants this tool outbound HTTP. Tools get no
                               # egress unless their entry says so, so a file tool
                               # cannot start making requests.
      # allow-private: false
    web-search:
      enabled: false           # no component implements this yet — the entry is a
                               # placeholder, and `jan-klod verify` will report it
                               # missing if you enable it.
      base-url: http://localhost:8080/search
      api-key: ${SEARCH_API_KEY}

  # ---- AI agent delegation via ACP ----
  # NOTE: inert. `Runtime::build_agent` never instantiates the `agent` category,
  # and no `agent-*` component exists to instantiate — enabling an entry here
  # resolves to an `ext/agent-claude-code.wasm` that is not built, which `verify`
  # reports as missing. The outbound seam is written (`delegate.rs`, unit-tested)
  # and needs a transport plus wiring; the inbound direction is already possible
  # by POSTing a turn to the REST surface.

  # ---- Network API surfaces ----
  # NOTE: there is no `api.*` extension. The REST surface is built into the core
  # binary and started with `jan-klod-gateway serve --bind <addr>`; an entry here
  # would resolve to an `ext/api-rest.wasm` that does not exist.
  #
  # Authentication is off unless JAN_KLOD_TOKEN is set in the gateway's
  # environment. Set it and every route except /health requires
  # `Authorization: Bearer <token>`; the TUI reads the same variable and sends it.
  # Unset, the surface is open — fine on the default loopback bind, and the
  # gateway warns when you bind elsewhere without one. The key lives in the
  # environment rather than here: a secret in a config file ends up in issues.

  # ---- Chat platform integrations ----
  # NOTE: likewise host-side, started with `jan-klod-gateway telegram`. The bot
  # token is read from the TELEGRAM_BOT_TOKEN environment variable, not from here
  # — a `token:` key in this file would be inert (and a secret in a config file).

# ============================================================================
# Agent behaviour — consumed by the core loop and its interceptors (task-router),
# not the core container itself.
# References below use provider *instance names* from extensions.provider above.
# ============================================================================

# The directory the file and execution substrates are jailed to. Every path a
# tool touches is resolved against this root and anything escaping it is denied.
# Omit the key to default to $PWD — the repo you launched `jan-klod serve` in.
# workspace: /path/to/your/repo

# The execution substrate (host-process), used by tool.git and tool.shell.
# DEFAULT-DENY: with this block absent or `enabled: false`, every exec is denied
# and those tools fail closed no matter what `extensions.tool` says. Enabling it
# does not by itself let the model run arbitrary commands — that takes
# `tool.shell` as well; `tool.git` alone can only run the read-only git
# subcommands its contract allows.
# ---- Persistence (host-side, not an extension) ----
# The conversation transcript and every interceptor's granted `host-storage` live
# in one SQLite file the core owns. It is deliberately not a component: the
# sandbox has no filesystem, so a store guest would need one granted back — and
# the transcript is the most sensitive thing here, so the fewer parties that hold
# it the better. Guests reach it only through `host-storage`, namespaced to
# themselves, and only when granted `persist: true`.
#
# Omit `path` (or the whole block) for an in-memory store: nothing survives a
# restart, which is the right default for trying it out and the wrong one for
# using it.
storage:
  path: ./jan-klod.db

execution:
  enabled: false
  timeout-secs: 30            # a command that outruns this is killed
  output-cap: 65536           # captured stdout/stderr bytes per run

# Which provider answers interceptors' model calls (the intent router's
# simple-vs-agentic classification). Names an instance from
# `extensions.provider` above; omit to use the head of the chain below.
# Classification is a two-token question, so pointing this at a small local
# model is the reason the key exists. An unknown name warns and falls back to
# the conservative label, and a classifier failure never fails the turn.
# classifier: ollama

# Provider fallback chain: the order enabled providers are tried in. Each entry
# names an instance from `extensions.provider` above. On a provider error the
# next one is tried; when the chain is exhausted the error surfaces to the user
# (no silent retry spiral).
#
# A name with no enabled instance is skipped with a warning (so the `ollama`
# entry below is inert until you enable it), and an enabled provider this list
# omits still runs — after the ones listed. Omit the whole key to accept boot
# order (alphabetical by instance name).
#
# NOT YET HONOURED: a per-provider `models:` list. Each provider instance serves
# exactly one `model` (set in its own entry above); trying several models within
# one provider needs a runtime model override the provider contract does not have
# yet. Configure a second instance pointing at the same `type` instead.
providers:
  - provider: openai
  - provider: ollama          # local last resort — inert until enabled above

# Task routing: task-type -> model. A classifier picks the closest matching key
# at runtime, and the chosen model is used for that turn.
#
# INERT UNLESS `interceptor.task-router` IS ENABLED (it is off above). Editing
# this block changes nothing on its own — the interceptor is what reads it, and
# enabling it costs one extra model call per turn to classify the task.
#
# Values are **model names, not providers**. The fallback chain is fixed when the
# agent boots, so routing cannot send a turn to a different endpoint; a value like
# `groq/llama-3.3-70b` applies `llama-3.3-70b` to whichever provider answers —
# which is not groq. The `provider/` form is still accepted (older configs use it)
# and warns. To prefer a different endpoint, order `providers:` above instead.
routing:
  code-generation:  gpt-4o
  code-review:      gpt-4o
  file-edit:        gpt-4o
  reasoning:        gpt-4o
  planning:         gpt-4o
  web-search:       gpt-4o-mini
  research:         gpt-4o-mini
  chat:             gpt-4o-mini
  clarification:    gpt-4o-mini
  agent-delegation: gpt-4o
  # user-defined example:
  # data-analysis:  gpt-4o-mini
