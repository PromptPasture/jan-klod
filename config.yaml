# Each entry under a category is one extension instance. `type` names the wasm component
# (ext/<category>-<type>.wasm) and defaults to the entry name. Other keys pass through to the
# instance. ${VAR} is expanded from the environment.

# serve:
#   principals:
#     operator: ${JAN_KLOD_TOKEN}

extensions:

  provider:
    openai:
      enabled: true
      type: openai
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6
    ollama:
      enabled: false
      type: openai
      base-url: http://localhost:11434/v1
      model: qwen2.5:7b
    lm-studio:
      enabled: false
      type: openai
      base-url: http://localhost:1234/v1
      model: qwen2.5:7b
    groq:
      enabled: false
      type: openai
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: llama-3.3-70b

  # `persist: true` lets an instance's host-storage writes survive restarts; off by default.
  interceptor:
    intent-router:
      enabled: true
    task-router:
      enabled: false           # one extra model call per turn
    context:
      enabled: true
      # context-tokens: 8000
    system:
      enabled: true
      # prompt: |
      #   You are a terse reviewer. Never write files.
    persona:
      enabled: false
      # personalities:
      #   helpful: "You are helpful, concise and focused on solving the problem."
      # default: helpful
    tool-selector:
      enabled: true
    permission:
      enabled: true
      # safe-calls: [find, fs:read, fs:grep, git, edit:view, proc-probe]
      # allow-absolute-paths: false
      # allow-parent-traversal: false
    guardrails:
      enabled: false
      # deny-tool-arguments:
      #   - pattern: "rm +-rf +/"
      #     tool: shell
      #     reason: "a recursive delete of a root path"
      #     decision: block
      # redact:
      #   - pattern: "sk-[A-Za-z0-9]{16,}"
      #     with: "[redacted api key]"

  registry:
    skills:
      enabled: false
    mcp:
      enabled: false

  # File tools are jailed to `workspace:` (or $PWD); everything a tool returns reaches the model provider.
  tool:
    fs:
      enabled: true
    edit:
      enabled: true
    find:
      enabled: true
    git:
      enabled: false           # needs `execution:`
    shell:
      enabled: false           # needs `execution:`; the model supplies the command
    fetch:
      enabled: false           # the URL can carry data out
      network: true
      # allow-private: false
    web-search:
      enabled: false           # the query discloses what the model is working on
      network: true
      base-url: https://api.serpapi.com/search
      api-key: ${SERPAPI_API_KEY}

  # No `agent` or `api` entries: the agent category is inert and the REST surface is built in (`jan-klod-gateway serve`).

# workspace: /path/to/your/repo

# env-passthrough: [GITHUB_TOKEN]

# limits:
#   max-iterations: 8

# network:
#   allow:
#     - http://127.0.0.1:11434

storage:
  path: ./jan-klod.db
  # cache-dir: ./wasmtime-cache

registry:
  trusted-keys: []
  url: https://promptpasture.github.io/jan-klod/index.json

# allow-unmanifested: true

execution:
  enabled: false
  timeout-secs: 30
  output-cap: 65536           # bytes per run
  sandbox:
    mode: os                  # `os` or `approval-only`
    writable: ["."]
    network: false
    require: false            # true: deny instead of falling back to approval-only

observability:
  output-format: human

# classifier: ollama

providers:
  - provider: openai
  - provider: ollama

# Inert unless `interceptor.task-router` is enabled.
routing:
  code-generation:  gpt-4o
  code-review:      gpt-4o
  file-edit:        gpt-4o
  reasoning:        gpt-4o
  planning:         gpt-4o
  web-search:       gpt-4o-mini
  research:         gpt-4o-mini
  chat:             gpt-4o-mini
  clarification:    gpt-4o-mini
  agent-delegation: gpt-4o
