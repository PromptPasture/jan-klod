# jan-klod configuration.
#
# Extensions are grouped by category (`provider`, `store`, `manager`, ...).
# Each *named* entry under a category is one configured extension instance.
#
# The host reads only two keys from an entry:
#   enabled  — whether to load the instance (omit/false = skip).
#   type     — which wasm component implements it: ext/<category>-<type>.wasm.
#              Defaults to the entry name, so `provider.openai` implies
#              `type: openai` -> provider-openai.wasm. Point several instances at
#              the same `type` to reuse one wasm (several OpenAI-compatible
#              endpoints use provider-openai); give an instance its own `type`
#              when it needs different payloads/headers.
#
# Every other key in an entry is opaque to the core and served back to the
# extension instance through the host-config interface. ${VAR} references are
# expanded from the environment.

extensions:

  # ---- Persistence: exactly one store instance should be enabled ----
  store:
    memory:
      enabled: true            # in-memory; default for dev, no persistence
    sqlite:
      enabled: false
      # type: store-sqlite
      path: ./jan-klod.db
    postgres:
      enabled: false
      # type: store-postgres
      dsn: ${DATABASE_URL}

  # ---- LLM providers: each entry is one configured endpoint ----
  # `type` selects the implementing wasm; reuse provider-openai for any
  # OpenAI-compatible endpoint, or set a dedicated type for a bespoke API.
  provider:
    openai:
      enabled: true
      type: openai  # default, shown for clarity
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    anthropic:
      enabled: false
      type: anthropic   # distinct wasm: different payload/headers
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-6
    ollama:
      enabled: false
      type: ollama        # custom Ollama API -> provider-ollama.wasm
      base-url: http://localhost:11434/v1
      model: qwen2.5:7b
    lm-studio:
      enabled: false
      type: openai
      base-url: http://localhost:1234/v1
      model: qwen2.5:7b
    groq:
      enabled: false
      type: openai        # yet another OpenAI-compatible endpoint
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: llama-3.3-70b

  # ---- Interceptors: sandboxed decision hooks the core loop dispatches by phase.
  #      enabled/disabled ONLY — ordering is structural (phase order + load order),
  #      never configured here. See docs/concepts/configuration.md#interceptors. ----
  interceptor:
    intent-router:
      enabled: true            # before-loop: simple vs agentic classification
    task-router:
      enabled: false           # select-model: task-type -> routing (Slice 2d)
    context:
      enabled: false           # select-context: history + compression (Slice 2d)
    tool-selector:
      enabled: true            # select-tools: expose the active tool set (Slice 2d).
                               # On by default: without it the enabled tool.* below
                               # are never offered to the model.
    permission:
      enabled: true            # tool-call: gate dangerous calls (Slice 2d).
                               # On by default: the file tools below can write, and
                               # a write must be confirmed before it happens.
      # Optional policy overrides. Each list, when present, REPLACES the built-in
      # default (it does not extend it); omit a key to keep the default.
      #   dangerous-names       — tool-name substrings that force a confirmation
      #   dangerous-ops         — `op` arg values that force a confirmation
      #   allow-absolute-paths  — when true, absolute-path args skip the scope gate
      #   allow-parent-traversal— when true, `..` traversal skips the scope gate
      # Defaults shown below; delete keys to accept them.
      # dangerous-names: [bash, shell, exec, eval, rm, delete, remove, write, kill, sudo]
      # dangerous-ops:   [write, delete, remove, exec, run]
      # allow-absolute-paths: false
      # allow-parent-traversal: false

  # ---- Capability catalogues ----
  registry:
    skills:
      enabled: false
    mcp:
      enabled: false

  # ---- Discrete callable tools ----
  # File tools are jailed to the workspace (the `workspace:` key below, or $PWD
  # when it is absent) and their writes are gated by interceptor.permission.
  tool:
    fs:
      enabled: true            # read / write / grep a workspace file
    edit:
      enabled: true            # hash-anchored partial edits (view -> replace/insert)
    shell:
      enabled: false           # run a command through host-process; off by default
    web-search:
      enabled: false
      base-url: http://localhost:8080/search
      api-key: ${SEARCH_API_KEY}

  # ---- AI agent delegation via ACP ----
  agent:
    claude-code:
      enabled: false

  # ---- Network API surfaces (host-serve) ----
  api:
    rest:
      enabled: false
      bind: 127.0.0.1:8088
      api-key: ${REST_API_KEY}

  # ---- Chat platform integrations (host-socket) ----
  chat:
    telegram:
      enabled: false
      token: ${TELEGRAM_BOT_TOKEN}

# ============================================================================
# Agent behaviour — consumed by the core loop and its interceptors (task-router),
# not the core container itself.
# References below use provider *instance names* from extensions.provider above.
# ============================================================================

# Provider/model fallback chain. Tried top-to-bottom; within a provider, each
# model is tried in order before moving to the next provider. If all are
# exhausted the error surfaces to the user (no silent retry spiral).
providers:
  - provider: openai
    models: [gpt-4o, gpt-4o-mini]
  - provider: ollama          # local, always-available last resort
    models: [qwen2.5:7b]

# Task routing: task-type -> <provider-instance>/<model>. Built-in task types
# are sensible defaults; add your own keys and the classifier picks the closest
# match at runtime — no code change needed.
routing:
  code-generation:  openai/gpt-4o
  code-review:      openai/gpt-4o
  file-edit:        openai/gpt-4o
  reasoning:        openai/gpt-4o
  planning:         openai/gpt-4o
  web-search:       openai/gpt-4o-mini
  research:         openai/gpt-4o-mini
  chat:             openai/gpt-4o-mini
  clarification:    openai/gpt-4o-mini
  agent-delegation: openai/gpt-4o
  # user-defined example:
  # data-analysis:  groq/llama-3.3-70b
