[package]
name = "tool-proc-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Phase 7 host-process probe: a tool-callable guest that runs a command through host-process and returns its stdout, exercising the exec substrate across the Component-Model boundary."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
