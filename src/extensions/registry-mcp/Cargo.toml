[package]
name = "registry-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "MCP gateway: connects to SSE MCP servers and proxies tool calls via mcp-registry WIT."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
