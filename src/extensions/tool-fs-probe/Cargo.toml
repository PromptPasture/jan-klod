[package]
name = "tool-fs-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Phase 7 host-fs probe: a tool-callable guest that writes then reads back a workspace file through the host-fs capability, to exercise it across the Component-Model boundary."

[lib]
# A reactor component: exports tool-world, no `main`.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
