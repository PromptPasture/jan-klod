[package]
name = "store-memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "In-memory memory-store extension (dev default, no persistence)."

[lib]
# A reactor component: exports the store-world, no `main`.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

# Same strict policy as the core workspace (this crate is standalone — guests
# live outside `src/core/`, so the levels are declared here rather than inherited).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
