[workspace]
resolver = "2"
members = [
    # Shared pure-Rust library, not a component: compiled into the guests below.
    "guest-fs",
    "provider-openai",
    "provider-anthropic",
    "registry-skills",
    "registry-mcp",
    "interceptor-intent-router",
    "interceptor-guardrails",
    "interceptor-permission",
    "interceptor-tool-selector",
    "interceptor-context",
    "interceptor-task-router",
    "interceptor-system",
    "tool-proc-probe",
    "tool-escape-probe",
    "tool-fs",
    "tool-shell",
    "tool-edit",
    "tool-find",
    "tool-git",
    "tool-fetch",
    "tool-ask-probe",
    "tool-hello",
    "tool-plan",
    "tool-proc",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
guest-fs = { path = "guest-fs" }
wit-bindgen = "0.58"
serde_json = "1"
whatlang = "0.16"
regex = "1"

# Linting policy, declared once and inherited by every guest via `lints.workspace =
# true`. Same strict policy as the host workspace (src/Cargo.toml) — the guests
# are their own workspace, so it is declared again here rather than inherited
# across
# workspaces.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

# `make test` compiles these crates' native (host-target) unit tests in the dev
# profile. Same disk/compile-time tradeoff as the host workspace
# (src/Cargo.toml): full debug info isn't needed for these, backtraces still
# resolve to file:line.
[profile.dev]
debug = "line-tables-only"

# And none at all for dependencies, as in the host workspace — the setting above
# already reaches them (a `[profile.dev]` key applies to every crate built with
# the profile), so this drops their remaining line tables rather than full debug
# info. `"*"` matches non-workspace packages only, so the guests keep
# `line-tables-only`.
#
# Native test builds only: the wasm guests use `[profile.release]` below, which
# is untouched.
[profile.dev.package."*"]
debug = 0

# Every guest is a wasm32-wasip2 component: shared size/LTO profile. Cargo only
# reads [profile.*] from a workspace root, which is why this moved here from each
# guest's own Cargo.toml when they merged into one workspace.
[profile.release]
opt-level = "s"
strip = true
lto = true

# #71 measured `lto = "thin"` as a separate `[profile.release-fast]` for local
# builds (both git hooks pay this profile on every commit/push) and rejected it
# — do not re-propose without new numbers. Same machine, same touched guest
# (tool-fs), before/after, each leg run 2-4x:
#   - guest build, changed source (touch one guest, `make -C src/extensions
#     all`, no clean): fat 1.57s/1.57s vs thin 1.26s/1.23s — thin ~0.3s faster.
#   - `du -sh ext/` after a full rebuild: fat 2.5M vs thin 2.8M — thin ~12%
#     bigger, because thin LTO optimizes less across crate boundaries.
#   - `JK_REQUIRE_GUESTS=1 make gate` (513 tests, 0 skipped both profiles):
#     fat 84.4s/91.1s/91.5s/98.7s (mean ~91.4s) vs thin 101.7s/105.6s/105.8s
#     (mean ~104.4s) — thin ~13s *slower*, consistently above every fat run
#     including one taken after the thin runs, so this isn't just load drift.
# The bigger guest wasm costs more at `make gate`'s end (Wasmtime's Cranelift
# compiles every staged component at boot, see #60) than thin LTO saves at the
# guest-build end: ~13s lost per gate run against ~0.3s saved per commit. Net
# negative — declined.
