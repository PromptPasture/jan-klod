[package]
name = "interceptor-intent-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "before-loop interceptor: layered intent router (language -> heuristics -> LLM classifier) that blocks the agentic loop for simple prompts and proceeds for agentic ones."

[lib]
# A reactor component: exports interceptor-world, no `main`.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
# Pure-Rust language detection for the intent router's tier-1 gate (no model
# call). Non-English input bypasses the English-only heuristics — see
# src/router/language.rs.
whatlang = "0.16"

# Same strict policy as the core workspace (guests live outside src/core/, so the
# levels are declared here rather than inherited).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
