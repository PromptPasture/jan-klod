[package]
name = "registry-skills"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Skill catalog: discovers named skills from .agents/skills/ and exposes them as tools."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = "s"
strip = true
lto = true
