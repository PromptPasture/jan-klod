# cargo-nextest configuration for the host workspace. Deliberately near-empty:
# the runner is the point, not tuning it. Wired up as `make test-fast` in this
# directory's Makefile; the gates still run `cargo test`.

[profile.default]
# Warn at 30s, never terminate. nextest's own default is a 60s period *with*
# termination, which would break one test's design on purpose:
# prompt_disconnect's `a_disconnected_client_does_not_hold_the_turn_open` sets
# JK_ANSWER_TIMEOUT_SECS to 120 deliberately, so that a regression is a turn
# that runs to the deadline and then fails its `elapsed < 30s` assertion with a
# message naming the cause. Killing it at 60s would replace that message with a
# bare timeout. The passing path finishes in seconds, so warning at 30s makes a
# regression here visible earlier than the assertion would.
slow-timeout = { period = "30s" }
