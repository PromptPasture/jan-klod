[package]
name = "jan-klod-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jan-klod-config = { path = "../config" }
# The shared turn vocabulary (#180): `Event`, `Message`, `ToolCall` and the
# rest live here, below both this crate and the session store, so the log can
# name them without depending on the loop. No new package in the tree — the
# workspace already builds it, and it depends on nothing but serde.
jan-klod-protocol = { path = "../protocol" }
# The session store (#180). This crate no longer defines the log, the
# projections or the SQLite connection; it composes them with a loop.
jk-session = { path = "../session" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
toml = "0.9"
thiserror.workspace = true
ureq = "3"
# SHA-256 for `ext install --sha256` (Slice 16c-1). **Zero new packages**:
# `sha2` 0.10 is already in Cargo.lock, pulled in by wasmtime-wasi via wiggle,
# so this only makes a transitive crate a direct one. Measured before adding,
# the way `schemars` was measured and rejected at 7.
sha2 = "0.10"
# Signature verification for `ext install` (Slice 16c-1). **One package, no
# transitive dependencies** — measured before adding. Verify-only on purpose:
# the core never signs anything, so a signing crate would be capability this
# binary has no use for. `minisign` (which signs) costs 10 packages and drags
# `rpassword` and `scrypt` in for interactive password prompts; the tests build
# their fixtures from `ring` + `blake2` instead (dev-only, in `jan-klod-host`),
# at one more package.
minisign-verify = "0.2.5"
url = "2"

# `derive` only, and only for the `registry_index` example, which writes the
# index as a struct in declaration order. No runtime code here derives any more:
# the frame shapes that did left with the surfaces (#179).
[dev-dependencies]
serde.workspace = true
# `tests/migration.rs` builds its fixture with SQLite directly, so it is the
# pre-log schema holding the old rows rather than a simulation of them. A
# dev-dependency, so the shipped crate still links no database (#180).
rusqlite = { version = "0.32", features = ["bundled"] }


# Landlock, for the Linux command sandbox (Slice 15c). Target-gated, so it never
# reaches a macOS or Windows build: 3 packages (landlock, enumflags2,
# enumflags2_derive), measured before adding. The crate is a safe wrapper over
# the syscalls, which is what lets this repository keep `unsafe_code = "deny"`
# while confining a command — see `sandbox_landlock` for the rest of that story.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

# Off by default so a plain `cargo test` does not build the example, the same
# block jan-klod-config's Cargo.toml carries for `dump`. It matters more here: this
# crate links wasmtime, and `registry_index` is a build-time generator nothing
# at runtime calls.
[features]
examples = []

[[example]]
name = "registry_index"
required-features = ["examples"]

[lints]
workspace = true
