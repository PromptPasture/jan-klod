[package]
name = "jan-klod-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# serde derives only. This crate is the wire *contract*, so it performs no I/O
# and picks no serializer: a transport (Slice 13b stdio, 13c WebSocket) decides
# that. serde_json is therefore a dev-dependency — the tests need a concrete
# format to assert the wire names against, the library does not.
[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
