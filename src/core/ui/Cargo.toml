[package]
name = "jan-klod-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A UI is NOT an extension — it is a separate client *process* that drives a
# running core over the REST surface (the LSP/server model). This crate depends on
# neither `jan-klod-core` nor Wasmtime: it speaks only the REST contract.
[[bin]]
name = "jan-klod-ui"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
# Terminal UI for the `tui` mode (binary only). Bundles the crossterm backend +
# event types (used via `ratatui::crossterm`). The pure App model in `app` needs
# no TUI deps and is unit-tested without a terminal.
ratatui = "0.30"

[dev-dependencies]
# The round-trip test stands up a canned HTTP server to drive the client against.
tiny_http = "0.12"

[lints]
workspace = true
