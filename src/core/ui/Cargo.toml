[package]
name = "jan-klod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A UI is NOT an extension — it is a separate client *process* that drives a
# core (the LSP/server model): over stdio, having spawned it, or over REST if one
# is already running. This crate depends on neither `jan-klod-core` nor Wasmtime:
# it speaks only the wire contract.
[[bin]]
name = "jan-klod"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
# The wire contract. Serde-only by design (#41), which is what lets a client
# depend on it without pulling in the core or Wasmtime — the rule this crate's
# comment above states. The stdio transport frames commands with it.
jan-klod-protocol = { path = "../protocol" }
# Terminal UI for the `tui` mode (binary only). Bundles the crossterm backend +
# event types (used via `ratatui::crossterm`). The pure App model in `app` needs
# no TUI deps and is unit-tested without a terminal.
ratatui = "0.30"
# Both are already in the tree as `ratatui-core` dependencies at these exact
# versions, so naming them here adds **zero** packages — measured, not assumed
# (#147). They are direct because wrapping is our own concern: `char` count,
# `str::len()` and display width are three different numbers, and an emoji is
# one grapheme, several chars, several bytes and two cells.
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
# The round-trip test stands up a canned HTTP server to drive the client against.
tiny_http = "0.12"

[lints]
workspace = true
