[package]
name = "jan-klod-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jan-klod-config = { path = "../config" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
toml = "0.9"
thiserror.workspace = true
ureq = "3"
# Host-side persistent store (Phase 3 Slice 3a). `bundled` compiles SQLite from
# source so there is no system-lib dependency; host-side, so no wasm constraint.
rusqlite = { version = "0.32", features = ["bundled"] }
# Host-side inbound HTTP surface (Phase 3 Slice 3b). Synchronous/blocking, which
# matches the sync loop + the !Send Wasmtime-backed AgentSession (no async runtime,
# no cross-thread sharing of the session). See docs/concepts/architecture.md#transport.
tiny_http = "0.12"

# Test-only, and in this direction on purpose. The mapping from `conductor::Event`
# to a protocol notification has to be asserted somewhere, and the protocol crate
# may not depend on this one — `jan-klod-protocol` is specified to carry nothing
# beyond serde (#41), and depending on the core would drag wasmtime into it. Nothing
# here depends on the protocol at runtime yet; the transports (#42, #43) are what
# will.
[dev-dependencies]
jan-klod-protocol = { path = "../protocol" }

[lints]
workspace = true
