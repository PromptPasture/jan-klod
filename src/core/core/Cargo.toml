[package]
name = "jan-klod-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jan-klod-config = { path = "../config" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = "3"
# Host-side persistent store (Phase 3 Slice 3a). `bundled` compiles SQLite from
# source so there is no system-lib dependency; host-side, so no wasm constraint.
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
