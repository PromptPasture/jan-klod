[package]
name = "jan-klod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "jan_klod_host"
path = "src/lib.rs"

[[bin]]
name = "jan-klod"
path = "src/main.rs"

# The library (the `agent` loop) drives the provider/store category worlds over
# the Component Model, so it needs wasmtime + config + serde_json directly — not
# just the examples. The binary links the lib and passes the live HTTP client.
[dependencies]
jan-klod-core = { path = "../core" }
jan-klod-config = { path = "../config" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
