[package]
name = "jan-klod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jan-klod-gateway"
path = "src/main.rs"

[dependencies]
jan-klod-core = { path = "../core" }
# The `serve` subcommand binds the host-side REST surface. Also used by the
# api_rest integration test (a normal dep is visible to tests too).
tiny_http = "0.12"

# Examples and integration tests drive the guests over the Component Model:
# spike_gate (Slice 1a gate), provider_probe (live single provider leg),
# component_harness (offline per-guest interface checks), and routing (the exit
# gate: the routed manager-agent-loop turn, via jan-klod-core's broker). They need
# wasmtime + config + serde_json to instantiate the category worlds and read the
# instance section. None of this ships in the `jan-klod` binary.
[dev-dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
jan-klod-config = { path = "../config" }
serde_json.workspace = true

[lints]
workspace = true
