[package]
name = "jan-klod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jan-klod-gateway"
path = "src/main.rs"

[dependencies]
jan-klod-core = { path = "../core" }
# The `serve` subcommand binds the host-side REST surface. Also used by the
# api_rest integration test (a normal dep is visible to tests too).
tiny_http = "0.12"

# Examples and integration tests drive the guests over the Component Model:
# spike_gate (Slice 1a gate), provider_probe (live single provider leg),
# component_harness (offline per-guest interface checks), and routing (the exit
# gate: the routed manager-agent-loop turn, via jan-klod-core's broker). They need
# wasmtime + config + serde_json to instantiate the category worlds and read the
# instance section. None of this ships in the `jan-klod` binary.
[dev-dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
jan-klod-config = { path = "../config" }
serde_json.workspace = true
# The rpc harness reads the frames back as the contract types rather than as
# hand-matched JSON, so a shape change fails the test instead of passing it.
jan-klod-protocol = { path = "../protocol" }
# The shipped-defaults gate drives core through the *real* UI client library
# rather than a hand-rolled HTTP client, so the test exercises the same code a
# user's TUI runs. Test-only: the `jan-klod` binary does not depend on the UI.
# Renamed: `provider_probe`'s generated WIT bindings already occupy the
# `jan_klod` namespace in this crate, so the client is imported as
# `jan_klod_client` to keep the two unambiguous.
jan-klod-client = { package = "jan-klod", path = "../ui" }

# The examples are opt-in, because cargo builds every example during `cargo test`
# and `cargo nextest run` just to check they compile. Each of these links
# wasmtime statically, so that was ~500MB in target/debug/examples and two extra
# wasmtime link steps on every test run, for binaries no test invokes: both are
# hand-run (`make probe` needs a live api key and network; `spike_gate` is the
# Slice 1a polyglot canary, whose automated equivalent is tests/it/polyglot.rs).
#
# They are still linted: `make clippy` passes the feature, and clippy type-checks
# without linking, so the check costs nothing it used to cost.
[features]
examples = []

[[example]]
name = "provider_probe"
required-features = ["examples"]

[[example]]
name = "spike_gate"
required-features = ["examples"]

[lints]
workspace = true
