[package]
name = "jan-klod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jan-klod-gateway"
path = "src/main.rs"

[dependencies]
jan-klod-core = { path = "../core" }
# The `serve` subcommand binds the host-side REST surface. Also used by the
# api_rest integration test (a normal dep is visible to tests too).
# Synchronous/blocking, which matches the sync loop + the !Send Wasmtime-backed
# AgentSession (no async runtime, no cross-thread sharing of the session). See
# docs/concepts/architecture.md#transport.
tiny_http = "0.12"
# The surfaces speak JSON on the wire: `serde` derives the frame types the
# stdio surfaces parse, `serde_json` reads and writes them. Both are already in
# the lock via jan-klod-core, so naming them here costs no package.
serde.workspace = true
serde_json.workspace = true
# The wire contract. `rpc` serves the commands and frames the answers; `acp` and
# `mcp` share its JSON-RPC framing. Never the other way round —
# `jan-klod-protocol` carries nothing beyond serde/serde_json (#41), and
# depending on this crate would drag wasmtime into every client that reads a
# frame. Was a dev-dependency here while the surfaces lived in the kernel.
jan-klod-protocol = { path = "../protocol" }

# Examples and integration tests drive the guests over the Component Model:
# spike_gate (Slice 1a gate), provider_probe (live single provider leg),
# component_harness (offline per-guest interface checks), and routing (the exit
# gate: the routed manager-agent-loop turn, via jan-klod-core's broker). They need
# wasmtime + config + serde_json to instantiate the category worlds and read the
# instance section. None of this ships in the `jan-klod` binary.
[dev-dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
jan-klod-config = { path = "../config" }
# The shipped-defaults gate drives core through the *real* UI client library
# rather than a hand-rolled HTTP client, so the test exercises the same code a
# user's TUI runs. Test-only: the `jan-klod` binary does not depend on the UI.
# Renamed: `provider_probe`'s generated WIT bindings already occupy the
# `jan_klod` namespace in this crate, so the client is imported as
# `jan_klod_client` to keep the two unambiguous.
jan-klod-client = { package = "jan-klod", path = "../tui" }
# Minisign fixtures for the `ext install` signature tests — see
# `tests/it/common/minisig.rs`. A test has to prove a *valid* signature is
# accepted, since a suite of refusals alone passes with a verifier that rejects
# everything, and there is no `minisign` binary to produce one with. The
# `minisign` crate signs but costs 10 packages (it brings `rpassword` and
# `scrypt` in for interactive prompts); these two cost **one** between them.
#
# `blake2` is pinned to 0.10 deliberately: it then shares `digest 0.10` with
# `sha2` and adds one package, where 0.11 pulls `digest 0.11` and adds four.
# It is needed because the installer requires *prehashed* signatures.
blake2 = "0.10"
# Ed25519 signing, and zero new packages: already in the lock via ureq/rustls.
ring = "0.17.14"
# The registry-index fixtures state a digest for the bytes they describe, the
# way a generated index does. **Zero new packages**, measured before adding:
# `sha2` 0.10 is already a direct dependency of jan-klod-core and shares
# `digest 0.10` with the `blake2` pin above.
sha2 = "0.10"

# The examples are opt-in, because cargo builds every example during `cargo test`
# and `cargo nextest run` just to check they compile. Each of these links
# wasmtime statically, so that was ~500MB in target/debug/examples and two extra
# wasmtime link steps on every test run, for binaries no test invokes: both are
# hand-run (`make probe` needs a live api key and network; `spike_gate` is the
# Slice 1a polyglot canary, whose automated equivalent is tests/it/polyglot.rs).
#
# They are still linted: `make clippy` passes the feature, and clippy type-checks
# without linking, so the check costs nothing it used to cost.
#
# `integration` gates tests/it/ (one binary since #68) the same way: it links
# wasmtime statically like the examples above, and cargo builds+links a test
# target regardless of which tests are selected to run within it —
# `#[ignore]`, name filters and a release-only job only save *run* time, not
# build/link time or disk. required-features on the `[[test]]` block below
# means the target is invisible unless `--features integration` (or
# `jan-klod-host/integration`) is passed, so every caller that needs the full
# suite must ask for it explicitly: see the root Makefile's `gate` and
# `harness` targets.
[features]
examples = []
integration = []

[[example]]
name = "provider_probe"
required-features = ["examples"]

[[example]]
name = "spike_gate"
required-features = ["examples"]

[[test]]
name = "it"
required-features = ["integration"]

[lints]
workspace = true
