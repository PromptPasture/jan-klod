# cargo-deny policy — the primary supply-chain gate for the Rust host workspace
# Covers the host workspace (repo root) and the guest extensions workspace (pkgs/extensions/*).
# Every invocation passes `--config`.
#
# cargo-deny config schema (v2 semantics): anything not explicitly allowed — a
# license, an advisory, or a source — is denied by default. There is no implicit
# catch-all to forget to set.

[advisories]
# Accept an ID only with a reason and an expiry plan. Vulnerability or unsound advisories
# are never accepted here. This entry is unmaintained, not a vulnerability; cargo-deny's
# unmaintained scope covers the whole graph. It goes when its parent crate stops depending on it.
ignore = [
    # unsafe-libyaml, via serde_yaml_ng which parses config.yaml. Replacing the parser is #312.
    "RUSTSEC-2024-0449",
]

[licenses]
# Permissive licenses only, verified against `cargo metadata --all-features`. Dual-licensed
# crates pass via a permissive branch; copyleft and unknown licenses are denied by omission.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions only warn. Wildcards are denied for registry crates; unpublished
# intra-workspace path deps have no version and are exempt via allow-wildcard-paths.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io is permitted; other registries and git dependencies are denied.
unknown-registry = "deny"
unknown-git = "deny"
